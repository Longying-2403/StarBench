# Packages StarBench for Windows on GitHub instead of on your computer.
#
# Push a tag such as v0.1.0 or v0.1.0-r.8: the installer and the zip are built
# from that commit and attached to a draft release, which you check and publish
# on GitHub. The tag has to start with the version in package.json. What comes
# after the version (r.8) is the label: it goes into the file names after the
# version, as in StarBench-0.1.0-r.8-win-x64.zip, and a tag with a label makes a
# pre-release. RELEASE_NOTES_<tag>.md, if the commit has one, is the text of
# the release; otherwise GitHub lists the commits.
#
# Run by hand from the Actions tab on a branch, it builds the same two files and
# leaves them on the run's page instead of making a release. A label typed there
# goes into the file names the same way.
#
# Every build also gets SHA256SUMS.txt and a signed build provenance
# attestation, which `gh attestation verify <file> --repo Longying-2403/StarBench`
# checks. Actions are pinned to a commit, since a tag can later be moved to
# other code; the comment after each one names its release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: 'Label for the file names, such as r.9 (optional)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # To create the release and attach the files to it.
      contents: write
      # To sign the build provenance attestation and keep it with the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          # No npm cache: a release is built from the commit and nothing else.
          package-manager-cache: false

      - name: Read the version and the label
        shell: bash
        env:
          TYPED_LABEL: ${{ inputs.label }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") label= ;;
              "v$version"-?*) label=${GITHUB_REF_NAME#"v$version-"} ;;
              *) echo "::error::Tag $GITHUB_REF_NAME does not start with v$version, the version in package.json."; exit 1 ;;
            esac
          else
            label=$TYPED_LABEL
          fi
          if [ -n "$label" ] && ! [[ "$label" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::The label \"$label\" may only hold letters, digits, dots, dashes and underscores."; exit 1
          fi
          echo "Version $version, label ${label:-(none)}"
          { echo "VERSION=$version"; echo "LABEL=$label"; } >> "$GITHUB_ENV"

      # Skips install scripts. Ours only downloads the Electron binary for running
      # the app; electron-builder fetches its own copy to package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package
        run: npm run dist

      # StarBench-0.1.0-win-x64-setup.exe becomes StarBench-0.1.0-r.8-win-x64-setup.exe.
      - name: Put the label in the file names
        if: env.LABEL != ''
        shell: bash
        run: |
          for file in dist/*-setup.exe dist/*.zip; do
            name=${file#dist/}
            labelled=${name/"-$VERSION-"/"-$VERSION-$LABEL-"}
            if [ "$labelled" = "$name" ]; then echo "::error::$name has no -$VERSION- to put the label after."; exit 1; fi
            mv "$file" "dist/$labelled"
            echo "$name -> $labelled"
          done

      # One line per file with its SHA-256, so a download can be checked.
      - name: Write the checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum *-setup.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A signed statement that these files came out of this workflow at this commit.
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-setup.exe
            dist/*.zip

      - name: Attach the files to a draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(dist/*-setup.exe dist/*.zip dist/SHA256SUMS.txt)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            # A rerun replaces the files of the draft, but never touches a published release.
            if [ "$draft" != true ]; then echo "::error::Release $tag is already published."; exit 1; fi
            gh release upload "$tag" "${files[@]}" --clobber
          else
            args=(--draft --verify-tag --title "StarBench $tag")
            if [ -f "RELEASE_NOTES_$tag.md" ]; then args+=(--notes-file "RELEASE_NOTES_$tag.md"); else args+=(--generate-notes); fi
            if [ -n "$LABEL" ]; then args+=(--prerelease); fi
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi

      - name: Keep the installer on the run's page
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep the zip on the run's page
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Keep the checksums on the run's page
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 14
