name: 问题报告
description: 出错、结果不对，或者和文档写的不一样
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你来报告问题。下面几项填好了，能少来回问几次。

        **安全漏洞请不要在这里报告。** 请用[私密漏洞报告](https://github.com/Longying-2403/StarBench/security/advisories/new)，只有作者看得到。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 在"设置 → 关于"里，例如 0.1.0-r.11。
      placeholder: 0.1.0-r.11
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 安装版
        - 免安装版
        - 从源码运行
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: 模型服务
      description: 问题和模型无关时，选最后一项。
      options:
        - DeepSeek
        - OpenAI（API Key）
        - ChatGPT 套餐登录
        - Anthropic
        - xAI
        - Gemini
        - 本地模型（Ollama、LM Studio、llama.cpp、vLLM 等）
        - 其他服务
        - 和模型服务无关
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 接口类型和模型
      description: 接口类型在"设置 → 模型"里这个服务的编辑页上。有关的话，也写上思考强度，以及有没有开联网搜索或 Fast Mode。
      placeholder: Gemini API，gemini-3.5-flash-lite，思考强度 Medium，开了联网搜索

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到了什么，原本以为会怎样。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么重现
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: 报错和记录
      description: 报错原文、截图，或者调试面板里的请求和回应。长的记录请放在两行 ``` 之间。

  - type: checkboxes
    id: privacy
    attributes:
      label: 发出之前
      description: issue 是公开的，谁都看得到。
      options:
        - label: 我已经删掉了 API Key、令牌、ChatGPT 登录信息，以及不想公开的对话和文件内容
          required: true
